     (beeCount) rispetto al numero di celle della griglia, solo un piccolo sottoinsieme di
     celle "vuote" e' davvero attivo (riceve NectarBee/ResidentBee nel tempo) — le altre
     restano vuote per sempre, ma finora usavano lo stesso identico asset
     (honeycomb_cell_vuota.svg) delle celle attive: a schermo, un giocatore vede l'ape andare
     sempre e solo su poche celle fra le tante identiche, senza modo di capire perche'. Questo
     e' il secondo stato "vuoto" — variante "disattivata" (HoneycombCell.isActive == false) —
     usato per le celle che non fanno parte di alcun ciclo di lavoro finche' beeCount non
     cresce abbastanza da attivarle.
     Stesso identico esagono di bordo (punti "43,28 35.5,15.01 20.5,15.01 13,28 20.5,40.99
