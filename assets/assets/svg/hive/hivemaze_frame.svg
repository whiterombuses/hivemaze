<!-- Apertura interna allargata a mano (2026-09-03) rispetto all'originale Claude Design in
     docs/skins/bee/imgs/concept/arnia_page/design/HiveMaze_game_frame/hivemaze-frame.svg:
     l'apertura era 310x560 (crema visibile 303x553, al netto dello stroke 7) mentre la griglia
     esagonale di HiveInteriorGame ne disegna 310.8x560.15 - le punte laterali degli esagoni
     finivano sopra il bordo scuro della cornice (difetto segnalato dall'utente, verificato a
     schermo). Apertura 310x560 -> 324x574 e pannello 326x576 -> 340x590, entrambi cresciuti di
     7px per lato: il centro dell'apertura resta (195,404), quindi la griglia non si sposta di
     un pixel, le si e' solo fatto spazio attorno. I 4 valori sono ripetuti in
     HiveInteriorGame._frameInteriorX/Y/Width/Height: se questo asset cambia, aggiornarli. -->
