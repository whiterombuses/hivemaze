<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Campo di fiori: landmark art per la cella Nodo Produzione ("Fioritura
       sorgente", CellType.productionNode, BeeCellMarker.landmarkArt — oggi
       disegnato come no-op in cell_decoration.dart). Sfondo trasparente: la
       cella dipinge già il riempimento rosa (BeeColors.cellProductionNode)
       sotto questo overlay, quindi qui non c'è alcun rettangolo di sfondo.
       Palette e tecnica (petalo piatto, centro a gradiente radiale chiaro→
       scuro, stelo a doppio tratto) riprendono 1:1 i token già nominati in
       BeeColors per l'artwork dei Nodi Home (flowerPetalPurple,
       flowerCenterOuter/Inner, stemDark/Light, leafFill), cosi i due luoghi
       resteranno visivamente coerenti quando quell'artwork sarà estratta. -->
  <defs>
    <radialGradient id="fc" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#FFD65C"/>
      <stop offset="1" stop-color="#FF9E1B"/>
    </radialGradient>
  </defs>

  <!-- Ciuffi d'erba alla base, per leggere "campo" e non "tre fiori isolati". -->
  <g fill="#79C86B" stroke="#4A2C11" stroke-width="2.5" stroke-linejoin="round">
    <path d="M14 93 Q11 84 16 76 Q19 85 18 93 Z"/>
    <path d="M44 95 Q42 87 47 80 Q49 88 47 95 Z"/>
    <path d="M64 94 Q62 86 67 79 Q69 87 67 94 Z"/>
    <path d="M88 92 Q85 84 90 77 Q92 85 91 92 Z"/>
  </g>

  <!-- Fiore A (sinistra, piu piccolo). -->
  <path d="M30 95 Q26 72 30 49" fill="none" stroke="#3C7A3C" stroke-width="6" stroke-linecap="round"/>
  <path d="M30 95 Q26 72 30 49" fill="none" stroke="#5FB55E" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="24" cy="74" rx="8" ry="4.5" transform="rotate(-32 24 74)" fill="#79C86B" stroke="#4A2C11" stroke-width="2.5"/>
  <g transform="translate(30 47) scale(0.8)">
    <g fill="#C79BF0" stroke="#4A2C11" stroke-width="3" stroke-linejoin="round">
      <ellipse cx="0" cy="-13" rx="8" ry="12"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="url(#fc)" stroke="#4A2C11" stroke-width="3"/>
  </g>

  <!-- Fiore B (centro, il piu grande — landmark principale della cella). -->
  <path d="M54 95 Q59 65 54 36" fill="none" stroke="#3C7A3C" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M54 95 Q59 65 54 36" fill="none" stroke="#5FB55E" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="61" cy="66" rx="9" ry="5" transform="rotate(28 61 66)" fill="#79C86B" stroke="#4A2C11" stroke-width="2.5"/>
  <g transform="translate(54 34) scale(1.05)">
    <g fill="#C79BF0" stroke="#4A2C11" stroke-width="3" stroke-linejoin="round">
      <ellipse cx="0" cy="-13" rx="8" ry="12"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="url(#fc)" stroke="#4A2C11" stroke-width="3"/>
  </g>

  <!-- Fiore C (destra, medio). -->
  <path d="M74 95 Q79 74 74 53" fill="none" stroke="#3C7A3C" stroke-width="6" stroke-linecap="round"/>
  <path d="M74 95 Q79 74 74 53" fill="none" stroke="#5FB55E" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="81" cy="76" rx="8" ry="4.5" transform="rotate(30 81 76)" fill="#79C86B" stroke="#4A2C11" stroke-width="2.5"/>
  <g transform="translate(74 51) scale(0.9)">
    <g fill="#C79BF0" stroke="#4A2C11" stroke-width="3" stroke-linejoin="round">
      <ellipse cx="0" cy="-13" rx="8" ry="12"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-13" rx="8" ry="12" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="url(#fc)" stroke="#4A2C11" stroke-width="3"/>
  </g>
</svg>
