       suffisso resta l'originale, testa in alto a sinistra.
       Le ali restano dorsali: ricevono solo la componente orizzontale della
       specchiatura, mai quella verticale (o finirebbero sotto il corpo).
       Vedi docs/wiki/hive_interior_screen.md per la mappa direzione->posa. -->
  <defs>
