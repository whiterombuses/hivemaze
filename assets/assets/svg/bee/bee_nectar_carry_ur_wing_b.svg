<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Posa "nectar_carry_ur": nectar_carry con la testa in alto a destra, per il volo
       dal basso a sinistra verso l'alto a destra.
