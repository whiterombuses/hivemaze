<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Posa "nectar_work_dl": nectar_work con la testa in basso a sinistra, per il volo
       dall'alto a destra verso il basso a sinistra.
       GENERATO da bee_nectar_work_wing_b.svg, non disegnato a mano: una ROTAZIONE RIGIDA
       di 30° attorno al centro della viewBox, identica per tutti e 4 i layer
       della posa. Essendo rigida nulla si stacca: ali sul dorso, zampe sotto,
       antenne sulla testa. (Il primo tentativo specchiava le parti separatamente e
       scuciva l'anatomia.) La scala 0.7660 serve a non far uscire il disegno dal
       box ruotando: va compensata lato codice, o l'ape risulta piu' piccola.
       La posa SENZA suffisso resta l'originale, testa in alto a sinistra.
       Vedi docs/wiki/hive_interior_screen.md per la mappa direzione->posa. -->
  <defs>
    <clipPath id="whClip2">
      <ellipse cx="145" cy="60" rx="33" ry="12" transform="rotate(-16 145 60)"></ellipse>
    </clipPath>
  </defs>
  <g transform="translate(115,95) scale(0.7660) rotate(-30) translate(-115,-95)">
  <g id="wing-b">
      <ellipse cx="145" cy="60" rx="33" ry="12" transform="rotate(-16 145 60)" fill="#D2EBF6" fill-opacity="0.9" stroke="#4A2617" stroke-width="5"></ellipse>
      <g clip-path="url(#whClip2)" fill="none" stroke="#A6D3E6" stroke-width="1.8" stroke-linecap="round">
        <path d="M114 64 C134 54 158 48 178 48"></path>
        <path d="M150 46 L154 64"></path>
      </g>
    </g>
  </g>
</svg>
