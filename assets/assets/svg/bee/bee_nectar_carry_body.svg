<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Corpo della posa "nectar_carry" (Fase 3a addendum, roadmap-arnia-interna.md): NectarBee
       in volo verso la cella con una goccia di nettare. Sorgente: Claude Design a partire da
       un riferimento fotografico scelto dall'utente (docs/skins/bee/imgs/concept/arnia_page/
       design/NectarBee_ResidentBee_SVG/nectar-carry.svg), con due correzioni fatte a mano
       dopo la consegna (non ottenute da Claude Design nonostante due richieste esplicite):
       la testa era staccata dal torace (due ellissi non abbastanza sovrapposte, contorni
       paralleli con una fessura bianca in mezzo) — riavvicinata; il pungiglione era un
       triangolo a spigoli vivi, poi troppo allungato — ridisegnato tozzo e curvo. Vedi
       bee_nectar_carry_wing_a.svg per lo split in layer. -->
  <defs>
    <linearGradient id="abdG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F8C468"></stop>
      <stop offset="0.45" stop-color="#F0A93C"></stop>
      <stop offset="1" stop-color="#DE8A22"></stop>
    </linearGradient>
    <linearGradient id="headG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F7C066"></stop>
      <stop offset="1" stop-color="#E89628"></stop>
    </linearGradient>
    <linearGradient id="creamG" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FCF6E7"></stop>
      <stop offset="1" stop-color="#E8D5AF"></stop>
    </linearGradient>
    <linearGradient id="dropG" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F9CE72"></stop>
      <stop offset="0.5" stop-color="#F2AC3B"></stop>
      <stop offset="1" stop-color="#E08C1C"></stop>
    </linearGradient>
    <clipPath id="abdClip">
