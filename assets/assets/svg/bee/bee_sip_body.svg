<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Corpo della posa "sip", senza ali/antenne: vedi bee_sip.svg per il file
       intero. Consegna 2c: le 4 texture (corpo + wing-a + wing-b + antennae)
       si sovrappongono nello stesso rettangolo per ricomporre l'ape animabile
       a parti indipendenti (game/rendering/bee_art.dart). NON toccare senza
       aggiornare anche le 3 varianti sorelle. -->
