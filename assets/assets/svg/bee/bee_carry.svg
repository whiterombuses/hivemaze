<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Posa "carry": corriere col secchiello di miele. Nodo Trasporto, celle della griglia.
       Estratta da `bee({pose})` in D3 Guida Implementazione. Le animazioni CSS
       (beeWgA/beeWgB sulle ali, beeAnt sulle antenne) sono rimosse: la Consegna 1
       spedisce pose statiche. I gruppi #wing-a/#wing-b/#antennae restano nominati
       apposta, così la Consegna 2 può animarli senza ri-estrarre l'asset. -->
  <defs>
    <radialGradient id="hd" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#FFEDA8"/><stop offset=".58" stop-color="#FFC62E"/><stop offset="1" stop-color="#EDA015"/>
    </radialGradient>
    <linearGradient id="ab" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#FFDA5C"/><stop offset="1" stop-color="#EDA015"/>
    </linearGradient>
    <linearGradient id="wg" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#EDFAFF" stop-opacity=".96"/><stop offset="1" stop-color="#A6DBF4" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="hm" x1=".1" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FFE277"/><stop offset="1" stop-color="#EDA015"/>
    </linearGradient>
    <clipPath id="ac"><ellipse cx="80" cy="94" rx="53" ry="39" transform="rotate(-16 80 94)"/></clipPath>
  </defs>

  <g fill="none" stroke="#5B3312" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 122 L78 144 L88 158"/><path d="M106 128 L106 150 L118 160"/><path d="M126 126 L131 148 L145 154"/>
  </g>
  <g id="wing-a">
    <ellipse cx="92" cy="26" rx="46" ry="18" transform="rotate(-20 92 26)" fill="url(#wg)" stroke="#6FB6E4" stroke-width="3.4"/>
    <path d="M62 20 q30 3 52 19" fill="none" stroke="#8FC9E8" stroke-width="2" opacity=".6"/>
  </g>
  <g id="wing-b">
    <ellipse cx="84" cy="48" rx="40" ry="15" transform="rotate(-8 84 48)" fill="url(#wg)" stroke="#6FB6E4" stroke-width="3.2"/>
  </g>
  <g transform="rotate(-16 80 94)">
    <path d="M34 76 L2 92 L34 112 Z" fill="#4E2C0E" stroke="#4A2C11" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <ellipse cx="80" cy="94" rx="53" ry="39" transform="rotate(-16 80 94)" fill="url(#ab)" stroke="#4A2C11" stroke-width="4.6"/>
  <g clip-path="url(#ac)">
    <g transform="rotate(-16 80 94)" fill="#4E2C0E">
      <rect x="36" y="50" width="22" height="95"/><rect x="70" y="50" width="24" height="95"/><rect x="106" y="50" width="20" height="95"/>
    </g>
  </g>
  <ellipse cx="72" cy="72" rx="25" ry="9" transform="rotate(-18 72 72)" fill="#ffffff" opacity=".22"/>
  <g fill="#FFFDF6" stroke="#4A2C11" stroke-width="4">
    <circle cx="118" cy="45" r="12"/><circle cx="106" cy="61" r="13"/><circle cx="103" cy="81" r="13"/><circle cx="110" cy="99" r="12"/><circle cx="123" cy="113" r="11"/>
  </g>
  <ellipse cx="136" cy="79" rx="28" ry="40" fill="#FFFDF6"/>
  <g fill="none" stroke="#5B3312" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M132 110 L142 128 L158 134"/><path d="M118 116 L126 136 L148 142"/>
  </g>
  <circle cx="160" cy="74" r="41" fill="url(#hd)" stroke="#4A2C11" stroke-width="4.6"/>
  <ellipse cx="147" cy="79" rx="9" ry="11.5" fill="#3A2208"/><ellipse cx="175" cy="79" rx="9" ry="11.5" fill="#3A2208"/>
  <circle cx="144" cy="74" r="3.6" fill="#ffffff"/><circle cx="172" cy="74" r="3.6" fill="#ffffff"/>
  <ellipse cx="134" cy="96" rx="9" ry="5.5" fill="#F58A8A" opacity=".55"/><ellipse cx="186" cy="96" rx="9" ry="5.5" fill="#F58A8A" opacity=".55"/>
  <path d="M152 97 q9 9 18 -1" fill="none" stroke="#4A2C11" stroke-width="4" stroke-linecap="round"/>
  <g id="antennae">
    <path d="M146 44 q-14 -20 -18 -32" fill="none" stroke="#5B3312" stroke-width="5" stroke-linecap="round"/>
    <circle cx="127" cy="9" r="7" fill="#8A5A26" stroke="#4A2C11" stroke-width="3.4"/>
    <path d="M177 44 q14 -18 24 -24" fill="none" stroke="#5B3312" stroke-width="5" stroke-linecap="round"/>
    <circle cx="203" cy="17" r="7" fill="#8A5A26" stroke="#4A2C11" stroke-width="3.4"/>
  </g>
  <path d="M129 51 q2 -41 33 -41 q33 0 39 41 z" fill="url(#hm)" stroke="#4A2C11" stroke-width="4.4" stroke-linejoin="round"/>
  <path d="M163 13 q-5 18 -3 37" fill="none" stroke="#4A2C11" stroke-opacity=".22" stroke-width="4"/>
  <path d="M112 51 q50 -15 100 0 q-50 17 -100 0 z" fill="#FFC62E" stroke="#4A2C11" stroke-width="4.4" stroke-linejoin="round"/>
  <g id="cargo">
    <path d="M156 136 q17 -20 35 -2" fill="none" stroke="#4A2C11" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 136 h48 l-6 30 q-18 8 -36 0 z" fill="#FFC62E" stroke="#4A2C11" stroke-width="4.2" stroke-linejoin="round"/>
    <ellipse cx="174" cy="136" rx="24" ry="8" fill="#FFAE12" stroke="#4A2C11" stroke-width="4"/>
    <path d="M162 132 q12 -12 24 0 q-12 8 -24 0 z" fill="#FFD34A" stroke="#4A2C11" stroke-width="3.4"/>
  </g>
</svg>