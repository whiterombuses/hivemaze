<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" width="230" height="190">
  <!-- Posa "nectar_carry_dl": nectar_carry con la testa in basso a sinistra, per il volo
       dall'alto a destra verso il basso a sinistra.
       GENERATO da bee_nectar_carry_body.svg, non disegnato a mano: una ROTAZIONE RIGIDA
       di 30° attorno al centro della viewBox, identica per tutti e 4 i layer
       della posa. Essendo rigida nulla si stacca: ali sul dorso, zampe sotto,
       antenne sulla testa. (Il primo tentativo specchiava le parti separatamente e
       scuciva l'anatomia.) La scala 0.7660 serve a non far uscire il disegno dal
       box ruotando: va compensata lato codice, o l'ape risulta piu' piccola.
       La posa SENZA suffisso resta l'originale, testa in alto a sinistra.
       Vedi docs/wiki/hive_interior_screen.md per la mappa direzione->posa. -->
  <defs>
    <linearGradient id="abdG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F8C468"></stop>
      <stop offset="0.45" stop-color="#F0A93C"></stop>
      <stop offset="1" stop-color="#DE8A22"></stop>
    </linearGradient>
    <linearGradient id="headG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F7C066"></stop>
      <stop offset="1" stop-color="#E89628"></stop>
    </linearGradient>
    <linearGradient id="creamG" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FCF6E7"></stop>
      <stop offset="1" stop-color="#E8D5AF"></stop>
    </linearGradient>
    <linearGradient id="dropG" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F9CE72"></stop>
      <stop offset="0.5" stop-color="#F2AC3B"></stop>
      <stop offset="1" stop-color="#E08C1C"></stop>
    </linearGradient>
    <clipPath id="abdClip">
